name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish signed APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches versionName
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "versionName = \"$version\"" watchface/build.gradle.kts; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName in watchface/build.gradle.kts"
            exit 1
          fi

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Without the key Gradle would fall back to the debug key, and those APKs could never be updated.
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Release signing secrets are not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          keytool -list -v -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | sed -n 's/^.*SHA256: //p' > "$RUNNER_TEMP/certificate-sha256"

      - name: Cache Google's validation tools
        uses: actions/cache@v6
        with:
          path: build/wff-tools
          key: wff-tools-${{ hashFiles('scripts/validate.sh') }}

      - name: Build release APKs
        run: ./gradlew assembleRelease

      - name: Validate against the Watch Face Format schema and Play memory limits
        run: bash scripts/validate.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          out=watchface/build/outputs/apk
          mkdir dist
          cp "$out/wearOs6/release/watchface-wearOs6-release.apk" "dist/compile-time-$version-wear-os-6.apk"
          cp "$out/wearOs4/release/watchface-wearOs4-release.apk" "dist/compile-time-$version-wear-os-4.apk"
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          certificate="$(cat "$RUNNER_TEMP/certificate-sha256")"
          gh release create "$GITHUB_REF_NAME" dist/* --title "Compile Time $version" --notes "$(cat <<EOF
          **Which file?** Look up the Wear OS version on your watch (the [install guide](https://github.com/${GITHUB_REPOSITORY}#which-file) shows where).

          | Your watch runs | Download |
          |---|---|
          | Wear OS 6 or newer | \`compile-time-$version-wear-os-6.apk\` |
          | Wear OS 4 or 5 | \`compile-time-$version-wear-os-4.apk\` |

          Install steps: https://github.com/${GITHUB_REPOSITORY}#install

          Signing certificate SHA-256: \`$certificate\`. Every release uses this key, so updates install over the previous version.
          EOF
          )"
